# Non-secret Core configuration. Every *_file value is a read-only mounted
# file; never replace these paths with secret values.
instance_id: 00000000-0000-4000-8000-000000000000
database_url_file: /run/secrets/database_url
grpc_listen: ":9443"
tls_cert_file: /run/secrets/tls_cert
tls_key_file: /run/secrets/tls_key
service_token_file: /run/secrets/service_token
enable_health_service: true
enable_reflection: false
core_task_max_concurrency: 4
core_task_lease_ttl: 30s
core_schedule_sweep_interval: 1s
core_shutdown_grace: 30s
# This path must resolve to a raw 32-byte mode-0400 mounted key file; the key
# value never belongs in YAML or PostgreSQL.
core_secret_master_key_file: /run/secrets/core_secret_master_key
core_secret_master_key_version: 1
core_extension_enabled: false
core_extension_staging_root: /var/lib/dirextalk-agent/extension-staging
core_extension_workspace_root: /var/lib/dirextalk-agent/extension-workspaces
core_extension_runner_socket: /run/dirextalk-agent/extension-runner.sock
core_extension_runner_uid: 65531
# Optional single-file static-site publication. The host provisioner owns this
# bind mount; Agent writes immutable releases beneath public/, while Caddy sees
# only that public subtree read-only at /.sites/.
core_static_sites_enabled: false
# core_static_sites_root: /var/lib/dirextalk-agent/static-sites
# core_static_sites_public_origin: https://node.example.com
# Keep disabled until the core-runner service has a private socket and genuinely
# delegated cgroup-v2 subtree. Runner UID is 65530; Agent UID is 65532.
# A failed runner nonce/full readiness probe keeps workload.core_runner absent.
core_workload_enabled: false
core_workload_runner_socket: /run/dirextalk-core-runner/runner.sock
core_workload_runner_uid: 65530
core_knowledge_enabled: false
# When enabled, Knowledge uses pgvector in the configured Agent PostgreSQL
# database. The content limits are fixed at 64 MiB total and 16 MiB per source.
# core_knowledge_vector_dimension: 1536
# Native Voice remains disabled unless the neutral Capability listener is
# enabled with the same positive account generation. URLs may point to the
# message-server's existing public relay; mounted files must be mode 0600.
core_voice_enabled: false
# capability_enabled: true
# capability_account_generation: 1
# core_voice_provider: volc_voice
# core_voice_host: https://rtc.volcengineapi.com
# core_voice_region: cn-north-1
# core_voice_app_id: "<24-char-volc-app-id>"
# core_voice_conversation_profile_id: 00000000-0000-4000-8000-000000000001
# core_voice_speech_profile_id: 00000000-0000-4000-8000-000000000002
# core_voice_access_key_id_file: /run/secrets/voice_access_key_id
# core_voice_secret_access_key_file: /run/secrets/voice_secret_access_key
# core_voice_rtc_app_key_file: /run/secrets/voice_rtc_app_key
# core_voice_webhook_secret_file: /run/secrets/voice_webhook_secret
# core_voice_callback_relay_token_file: /run/secrets/voice_relay_token
# core_voice_webhook_url: https://message.example.com/_p2p/agent/voice/webhook
# core_voice_custom_llm_url: https://message.example.com/_p2p/agent/voice/volc/custom-llm
# core_voice_client_transcript_enabled: false
# Optional Agent-private callback listener. Keep this on a separate port;
# it must never reuse grpc_listen.
# core_voice_callback_enabled: true
# core_voice_callback_listen: ":8444"
# core_voice_callback_tls_cert_file: /run/secrets/tls_cert
# core_voice_callback_tls_key_file: /run/secrets/tls_key

# core_voice_provider: volc_voice
# core_voice_host: https://rtc.volcengineapi.com
# core_voice_region: cn-north-1
# core_voice_app_id: "<24-char-volc-app-id>"
# core_voice_conversation_profile_id: 00000000-0000-4000-8000-000000000001
# core_voice_speech_profile_id: 00000000-0000-4000-8000-000000000002
# core_voice_access_key_id_file: /run/secrets/voice_access_key_id
# core_voice_secret_access_key_file: /run/secrets/voice_secret_access_key
# core_voice_rtc_app_key_file: /run/secrets/voice_rtc_app_key
# core_voice_webhook_secret_file: /run/secrets/voice_webhook_secret
# core_voice_callback_relay_token_file: /run/secrets/voice_relay_token
# core_voice_webhook_url: https://message.example.com/_p2p/agent/voice/webhook
# core_voice_custom_llm_url: https://message.example.com/_p2p/agent/voice/volc/custom-llm
# core_voice_client_transcript_enabled: false
# Optional Agent-private callback listener. Keep this on a separate port;
# it must never reuse grpc_listen.
# core_voice_callback_enabled: true
# core_voice_callback_listen: ":8444"
# core_voice_callback_tls_cert_file: /run/secrets/tls_cert
# core_voice_callback_tls_key_file: /run/secrets/tls_key

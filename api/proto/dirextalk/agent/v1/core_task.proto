syntax = "proto3";

package dirextalk.agent.v1;

option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";
import "google/protobuf/struct.proto";

enum CoreTaskStatus {
  CORE_TASK_STATUS_UNSPECIFIED = 0;
  CORE_TASK_STATUS_QUEUED = 1;
  CORE_TASK_STATUS_RUNNING = 2;
  CORE_TASK_STATUS_WAITING_USER = 3;
  CORE_TASK_STATUS_SUCCEEDED = 4;
  CORE_TASK_STATUS_FAILED = 5;
  CORE_TASK_STATUS_CANCELED = 6;
}

enum CoreTaskKind {
  CORE_TASK_KIND_UNSPECIFIED = 0;
  CORE_TASK_KIND_AGENT = 1;
  CORE_TASK_KIND_EXTENSION = 2;
  CORE_TASK_KIND_KNOWLEDGE_INDEX = 3;
  CORE_TASK_KIND_AWS_CHANGE = 4;
}

message CoreExtensionSelection {
  string kind = 1;
  string id = 2;
  string pinned_version = 3;
  string digest = 4;
  repeated string allowed_tools = 5;
}

message CoreTaskTemplate {
  string goal = 1;
  string conversation_id = 2;
  string model_profile_id = 3;
  repeated string attachment_refs = 4;
  repeated CoreExtensionSelection extensions = 5;
  repeated string knowledge_refs = 6;
  int64 timeout_seconds = 8;
}

message CoreTask {
  string task_id = 1;
  string goal = 2;
  string conversation_id = 3;
  string model_profile_id = 4;
  repeated string attachment_refs = 5;
  repeated CoreExtensionSelection extensions = 8;
  repeated string knowledge_refs = 9;
  int64 timeout_seconds = 10;
  CoreTaskStatus status = 12;
  uint32 attempt = 13;
  uint64 lease_epoch = 14;
  google.protobuf.Timestamp available_at = 15;
  string retry_of_task_id = 16;
  google.protobuf.Struct result = 17;
  string failure_code = 18;
  string failure_summary = 19;
  int64 revision = 20;
  google.protobuf.Timestamp created_at = 21;
  google.protobuf.Timestamp updated_at = 22;
  CoreTaskKind kind = 23;
}

message TaskServiceCreateTaskRequest {
  string idempotency_key = 1;
  string goal = 2;
  string conversation_id = 3;
  string model_profile_id = 4;
  repeated string attachment_refs = 5;
  repeated CoreExtensionSelection extensions = 8;
  repeated string knowledge_refs = 9;
  int64 timeout_seconds = 10;
}
message TaskServiceCreateTaskResponse { CoreTask task = 1; }
message TaskServiceGetTaskRequest { string task_id = 1; }
message TaskServiceGetTaskResponse { CoreTask task = 1; }
message TaskServiceListTasksRequest {
  int32 page_size = 1;
  string page_token = 2;
  CoreTaskStatus status = 3;
}
message TaskServiceListTasksResponse {
  repeated CoreTask tasks = 1;
  string next_page_token = 2;
}
message TaskServiceCancelTaskRequest {
  string idempotency_key = 1;
  string task_id = 2;
  int64 expected_revision = 3;
  string reason = 4;
}
message TaskServiceCancelTaskResponse { CoreTask task = 1; }
message TaskServiceRetryTaskRequest {
  string idempotency_key = 1;
  string task_id = 2;
  int64 expected_revision = 3;
}
message TaskServiceRetryTaskResponse { CoreTask task = 1; }
message TaskServiceDeleteTaskRequest {
  string idempotency_key = 1;
  string task_id = 2;
  int64 expected_revision = 3;
}
message TaskServiceDeleteTaskResponse {}

message CoreTaskEvent {
  string task_id = 1;
  int64 sequence = 2;
  string event_id = 3;
  uint32 attempt = 4;
  CoreTaskStatus status = 5;
  string phase = 6;
  string progress_message = 7;
  optional double percent = 8;
  google.protobuf.Struct result = 9;
  string error_code = 10;
  string error_summary = 11;
  google.protobuf.Timestamp occurred_at = 12;
}
message TaskServiceWatchTaskEventsRequest {
  string task_id = 1;
  int64 after_sequence = 2;
}
message TaskServiceWatchTaskEventsResponse { CoreTaskEvent event = 1; }

service TaskService {
  rpc CreateTask(TaskServiceCreateTaskRequest) returns (TaskServiceCreateTaskResponse);
  rpc GetTask(TaskServiceGetTaskRequest) returns (TaskServiceGetTaskResponse);
  rpc ListTasks(TaskServiceListTasksRequest) returns (TaskServiceListTasksResponse);
  rpc CancelTask(TaskServiceCancelTaskRequest) returns (TaskServiceCancelTaskResponse);
  rpc RetryTask(TaskServiceRetryTaskRequest) returns (TaskServiceRetryTaskResponse);
  rpc DeleteTask(TaskServiceDeleteTaskRequest) returns (TaskServiceDeleteTaskResponse);
  rpc WatchTaskEvents(TaskServiceWatchTaskEventsRequest) returns (stream TaskServiceWatchTaskEventsResponse);
}

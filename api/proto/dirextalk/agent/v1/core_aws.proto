syntax = "proto3";

package dirextalk.agent.v1;

option go_package = "github.com/YingSuiAI/dirextalk-agent/api/gen/dirextalk/agent/v1;agentv1";

import "google/protobuf/timestamp.proto";

// CoreCloudControlService stores the sole App-managed AWS credential.

message CoreAWSCredential {
  string credential_id = 1;
  string name = 2;
  string region = 3;
  string account_id = 4;
  string user_arn = 5;
  bool access_key_configured = 6;
  bool secret_access_key_configured = 7;
  bool session_token_configured = 8;
  int64 revision = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp updated_at = 11;
  int64 verified_revision = 12;
  google.protobuf.Timestamp tested_at = 13;
}

message CoreCloudControlServiceCreateCredentialRequest {
  string idempotency_key = 1;
  string name = 2;
  string region = 3;
  string access_key_id = 4;
  string secret_access_key = 5;
  string session_token = 6;
}
message CoreCloudControlServiceCreateCredentialResponse { CoreAWSCredential credential = 1; }
message CoreCloudControlServiceGetCredentialRequest { string credential_id = 1; }
message CoreCloudControlServiceGetCredentialResponse { CoreAWSCredential credential = 1; }
message CoreCloudControlServiceListCredentialsRequest { int32 page_size = 1; string page_token = 2; }
message CoreCloudControlServiceListCredentialsResponse {
  repeated CoreAWSCredential credentials = 1;
  string next_page_token = 2;
}
message CoreCloudControlServiceUpdateCredentialRequest {
  string idempotency_key = 1;
  string credential_id = 2;
  int64 expected_revision = 3;
  string name = 4;
  string region = 5;
  string access_key_id = 6;
  string secret_access_key = 7;
  string session_token = 8;
}
message CoreCloudControlServiceUpdateCredentialResponse { CoreAWSCredential credential = 1; }
message CoreCloudControlServiceDeleteCredentialRequest {
  string idempotency_key = 1;
  string credential_id = 2;
  int64 expected_revision = 3;
}
message CoreCloudControlServiceDeleteCredentialResponse {}
service CoreCloudControlService {
  rpc CreateCredential(CoreCloudControlServiceCreateCredentialRequest) returns (CoreCloudControlServiceCreateCredentialResponse);
  rpc GetCredential(CoreCloudControlServiceGetCredentialRequest) returns (CoreCloudControlServiceGetCredentialResponse);
  rpc ListCredentials(CoreCloudControlServiceListCredentialsRequest) returns (CoreCloudControlServiceListCredentialsResponse);
  rpc UpdateCredential(CoreCloudControlServiceUpdateCredentialRequest) returns (CoreCloudControlServiceUpdateCredentialResponse);
  rpc DeleteCredential(CoreCloudControlServiceDeleteCredentialRequest) returns (CoreCloudControlServiceDeleteCredentialResponse);
}
